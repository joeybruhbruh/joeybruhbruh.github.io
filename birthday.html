<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Happy Birthday — Phan Nguyen Viet Dung</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Lobster&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --pink: #ff4fa3;
                --hot: #ff2d87;
                --magenta: #ff3ebf;
                --coral: #ff7a59;
                --tangerine: #ffb13b;
                --yellow: #ffe14a;
                --mint: #5be3c0;
                --sky: #5ec8ff;
                --indigo: #7a5cff;
                --lavender: #c79bff;
                --cream: #fff7e7;
                --ink: #1b0f2a;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                height: 100%;
                width: 100%;
            }
            body {
                font-family: 'DM Sans', system-ui, sans-serif;
                color: var(--cream);
                background: radial-gradient(120% 80% at 50% 110%, #2b1255 0%, #1a0a3d 40%, #0b0420 100%);
                cursor: crosshair;
            }

            /* ---------- background layers ---------- */
            .stage {
                position: fixed;
                inset: 0;
                overflow: hidden;
            }
            /* slow swirling color blobs */
            .blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.55;
                mix-blend-mode: screen;
                animation: float 18s ease-in-out infinite;
            }
            .blob.b1 {
                width: 46vmin;
                height: 46vmin;
                background: #ff3ebf;
                top: -8vmin;
                left: -6vmin;
                animation-delay: -2s;
            }
            .blob.b2 {
                width: 52vmin;
                height: 52vmin;
                background: #5ec8ff;
                bottom: -12vmin;
                right: -10vmin;
                animation-delay: -7s;
            }
            .blob.b3 {
                width: 36vmin;
                height: 36vmin;
                background: #ffb13b;
                top: 30%;
                left: 60%;
                animation-delay: -12s;
            }
            .blob.b4 {
                width: 30vmin;
                height: 30vmin;
                background: #7a5cff;
                bottom: 10%;
                left: 8%;
                animation-delay: -4s;
            }
            @keyframes float {
                0%,
                100% {
                    transform: translate(0, 0) scale(1);
                }
                33% {
                    transform: translate(4vmin, -3vmin) scale(1.08);
                }
                66% {
                    transform: translate(-3vmin, 3vmin) scale(0.95);
                }
            }

            /* twinkling sparkles */
            .stars {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }
            .star {
                position: absolute;
                width: 6px;
                height: 6px;
                background: radial-gradient(circle, #fff, transparent 70%);
                border-radius: 50%;
                opacity: 0;
                animation: twinkle 4s ease-in-out infinite;
            }
            @keyframes twinkle {
                0%,
                100% {
                    opacity: 0;
                    transform: scale(0.4);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* confetti */
            .confetti {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
            }
            .c {
                position: absolute;
                top: -8vh;
                width: 10px;
                height: 14px;
                border-radius: 2px;
                opacity: 0.95;
                animation:
                    fall linear infinite,
                    spin 1.6s linear infinite;
            }
            @keyframes fall {
                to {
                    transform: translate3d(var(--dx, 0), 115vh, 0) rotate(720deg);
                }
            }
            @keyframes spin {
                to {
                    transform: rotateZ(360deg);
                }
            }

            /* balloons */
            .balloons {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
            }
            .balloon {
                position: absolute;
                bottom: -30vh;
                width: 80px;
                animation: rise linear infinite;
            }
            @keyframes rise {
                0% {
                    transform: translate3d(0, 0, 0) rotate(-3deg);
                }
                50% {
                    transform: translate3d(40px, -60vh, 0) rotate(3deg);
                }
                100% {
                    transform: translate3d(-20px, -130vh, 0) rotate(-2deg);
                }
            }

            /* ---------- center stack ---------- */
            .wrap {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
            }
            .stack {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }

            /* greeting ribbon above */
            .ribbon {
                font-family: 'Caveat', cursive;
                font-weight: 700;
                font-size: clamp(20px, 2.6vw, 36px);
                letter-spacing: 0.04em;
                color: #ffd6ec;
                text-shadow: 0 0 18px rgba(255, 90, 180, 0.55);
                animation: wobble 3.4s ease-in-out infinite;
            }
            @keyframes wobble {
                0%,
                100% {
                    transform: rotate(-2deg) translateY(0);
                }
                50% {
                    transform: rotate(2deg) translateY(-4px);
                }
            }

            .cake-wrap {
                position: relative;
                width: min(58vmin, 520px);
                aspect-ratio: 1 / 1.05;
                filter: drop-shadow(0 28px 50px rgba(0, 0, 0, 0.45));
                animation: breath 4.6s ease-in-out infinite;
            }
            @keyframes breath {
                0%,
                100% {
                    transform: translateY(0) rotate(-0.4deg);
                }
                50% {
                    transform: translateY(-8px) rotate(0.4deg);
                }
            }
            .cake-wrap svg {
                width: 100%;
                height: 100%;
                display: block;
                overflow: visible;
            }

            /* name */
            .name {
                font-family: 'Bagel Fat One', system-ui, sans-serif;
                font-size: clamp(30px, 5.4vw, 84px);
                line-height: 0.95;
                letter-spacing: 0.005em;
                margin: 6px 0 2px;
                text-align: center;
                display: flex;
                gap: 0.02em;
                flex-wrap: wrap;
                justify-content: center;
            }
            .name span {
                display: inline-block;
                line-height: 1.15;
                padding-bottom: 0.12em;
                background: linear-gradient(180deg, #fff 0%, #ffd9ec 55%, #ff6bb6 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                -webkit-text-stroke: 2px rgba(27, 15, 42, 0.35);
                text-shadow:
                    0 2px 0 rgba(0, 0, 0, 0.18),
                    0 0 22px rgba(255, 90, 180, 0.35);
                animation: bob 2.6s ease-in-out infinite;
            }
            .name span:nth-child(3n) {
                animation-duration: 2.9s;
            }
            .name span:nth-child(3n + 1) {
                animation-duration: 3.3s;
            }
            .name span.space {
                width: 0.34em;
                background: none;
                -webkit-text-stroke: 0;
            }
            @keyframes bob {
                0%,
                100% {
                    transform: translateY(0) rotate(-1.5deg);
                }
                50% {
                    transform: translateY(-10px) rotate(1.5deg);
                }
            }
            /* hue cycle for variety */
            .name span:nth-child(6n + 1) {
                filter: hue-rotate(0deg);
            }
            .name span:nth-child(6n + 2) {
                filter: hue-rotate(40deg);
            }
            .name span:nth-child(6n + 3) {
                filter: hue-rotate(80deg);
            }
            .name span:nth-child(6n + 4) {
                filter: hue-rotate(160deg);
            }
            .name span:nth-child(6n + 5) {
                filter: hue-rotate(220deg);
            }
            .name span:nth-child(6n + 6) {
                filter: hue-rotate(290deg);
            }

            .credit {
                font-family: 'Caveat', cursive;
                font-weight: 500;
                font-size: clamp(14px, 1.5vw, 20px);
                color: #ffd6ec;
                opacity: 0.85;
                letter-spacing: 0.02em;
                display: inline-flex;
                align-items: center;
                gap: 0.4em;
                margin-top: 2px;
            }
            .credit .heart {
                display: inline-block;
                color: #ff4fa3;
                animation: beat 1.1s ease-in-out infinite;
            }
            @keyframes beat {
                0%,
                100% {
                    transform: scale(1);
                }
                25% {
                    transform: scale(1.25);
                }
                50% {
                    transform: scale(0.95);
                }
                75% {
                    transform: scale(1.15);
                }
            }

            /* candle flame flicker */
            .flame {
                transform-origin: 50% 100%;
                animation: flick 0.18s ease-in-out infinite alternate;
            }
            .flame.f2 {
                animation-duration: 0.22s;
            }
            .flame.f3 {
                animation-duration: 0.16s;
            }
            .flame.f4 {
                animation-duration: 0.2s;
            }
            .flame.f5 {
                animation-duration: 0.24s;
            }
            @keyframes flick {
                from {
                    transform: scale(1, 1) translateY(0);
                }
                to {
                    transform: scale(0.92, 1.08) translateY(-1px);
                }
            }
            .glow {
                transform-origin: 50% 50%;
                animation: glow 1.6s ease-in-out infinite;
                mix-blend-mode: screen;
            }
            @keyframes glow {
                0%,
                100% {
                    opacity: 0.55;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.95;
                    transform: scale(1.18);
                }
            }

            /* drips wiggle subtly */
            .drip {
                animation: drop 3.2s ease-in-out infinite;
            }
            @keyframes drop {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(2px);
                }
            }

            /* sprinkles spin in place */
            .sprinkle {
                transform-origin: center;
                animation: tilt 3s ease-in-out infinite;
            }
            @keyframes tilt {
                0%,
                100% {
                    transform: rotate(-6deg);
                }
                50% {
                    transform: rotate(6deg);
                }
            }

            /* sneaky HTTP text – low contrast piped icing */
            .sneaky {
                font-family: 'Lobster', cursive;
                font-size: 36px;
                fill: #ffb4d8;
                opacity: 0.5;
                letter-spacing: 0.04em;
                paint-order: stroke;
                stroke: #ff7ec0;
                stroke-width: 1.2px;
                filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.35));
            }

            /* click hint */
            .hint {
                position: fixed;
                bottom: 12px;
                right: 18px;
                font-family: 'Caveat', cursive;
                font-size: 16px;
                color: #ffd6ec;
                opacity: 0.5;
                letter-spacing: 0.05em;
                pointer-events: none;
                animation: pulse 2.4s ease-in-out infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.35;
                }
                50% {
                    opacity: 0.8;
                }
            }

            /* burst sparkle on click */
            .spark {
                position: fixed;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                pointer-events: none;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle, #fff, #ffb13b 60%, transparent 70%);
                animation: pop 0.9s ease-out forwards;
            }
            @keyframes pop {
                0% {
                    transform: translate(-50%, -50%) scale(0.4);
                    opacity: 1;
                }
                100% {
                    transform: translate(calc(-50% + var(--tx, 0)), calc(-50% + var(--ty, 0))) scale(1);
                    opacity: 0;
                }
            }

            @media (max-width: 520px) {
                .cake-wrap {
                    width: 72vmin;
                }
            }
            @media (max-height: 640px) {
                .cake-wrap {
                    width: min(44vmin, 380px);
                }
                .ribbon {
                    font-size: clamp(16px, 2vw, 22px);
                }
                .stack {
                    gap: 2px;
                }
            }
        </style>
    </head>
    <body>
        <div class="stage" aria-hidden="true">
            <div class="blob b1"></div>
            <div class="blob b2"></div>
            <div class="blob b3"></div>
            <div class="blob b4"></div>
            <div class="stars" id="stars"></div>
            <div class="confetti" id="confetti"></div>
            <div class="balloons" id="balloons"></div>
        </div>

        <div class="wrap">
            <div class="stack">
                <div class="ribbon">✦ happy birthday ✦</div>

                <div class="cake-wrap">
                    <svg viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- tier gradients -->
                            <linearGradient id="tBot" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#ffd28a" />
                                <stop offset="1" stop-color="#e98a3c" />
                            </linearGradient>
                            <linearGradient id="tMid" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#ff9ed2" />
                                <stop offset="1" stop-color="#ff4f9c" />
                            </linearGradient>
                            <linearGradient id="tTop" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#b9eaff" />
                                <stop offset="1" stop-color="#5ec8ff" />
                            </linearGradient>

                            <!-- icing gradients -->
                            <linearGradient id="iBot" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#ffffff" />
                                <stop offset="1" stop-color="#fff0c2" />
                            </linearGradient>
                            <linearGradient id="iMid" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#ffffff" />
                                <stop offset="1" stop-color="#ffd1e6" />
                            </linearGradient>
                            <linearGradient id="iTop" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#ffffff" />
                                <stop offset="1" stop-color="#dcf3ff" />
                            </linearGradient>

                            <!-- candle body -->
                            <linearGradient id="candle1" x1="0" x2="1">
                                <stop stop-color="#ff5577" />
                                <stop offset="1" stop-color="#ffb46b" />
                            </linearGradient>
                            <linearGradient id="candle2" x1="0" x2="1">
                                <stop stop-color="#7a5cff" />
                                <stop offset="1" stop-color="#5ec8ff" />
                            </linearGradient>
                            <linearGradient id="candle3" x1="0" x2="1">
                                <stop stop-color="#5be3c0" />
                                <stop offset="1" stop-color="#ffe14a" />
                            </linearGradient>
                            <linearGradient id="candle4" x1="0" x2="1">
                                <stop stop-color="#ff3ebf" />
                                <stop offset="1" stop-color="#7a5cff" />
                            </linearGradient>
                            <linearGradient id="candle5" x1="0" x2="1">
                                <stop stop-color="#ffe14a" />
                                <stop offset="1" stop-color="#ff7a59" />
                            </linearGradient>

                            <!-- flame -->
                            <radialGradient id="flameG" cx=".5" cy=".7" r=".7">
                                <stop offset="0" stop-color="#fff7c2" />
                                <stop offset=".45" stop-color="#ffd24a" />
                                <stop offset=".85" stop-color="#ff6a2a" />
                                <stop offset="1" stop-color="#ff2a8a" stop-opacity="0" />
                            </radialGradient>
                            <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
                                <stop offset="0" stop-color="#ffd86a" stop-opacity=".9" />
                                <stop offset="1" stop-color="#ffb13b" stop-opacity="0" />
                            </radialGradient>

                            <!-- plate -->
                            <linearGradient id="plateG" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0" stop-color="#fff" />
                                <stop offset="1" stop-color="#c8b4ff" />
                            </linearGradient>

                            <!-- icing drip path used for clipping highlight -->
                            <clipPath id="midClip">
                                <rect x="120" y="320" width="360" height="160" rx="14" />
                            </clipPath>
                        </defs>

                        <!-- ground glow -->
                        <ellipse cx="300" cy="588" rx="240" ry="22" fill="#000" opacity=".35" />

                        <!-- plate -->
                        <ellipse cx="300" cy="572" rx="232" ry="26" fill="url(#plateG)" />
                        <ellipse cx="300" cy="566" rx="232" ry="20" fill="#fff" />
                        <ellipse cx="300" cy="562" rx="218" ry="14" fill="#f1e6ff" />

                        <!-- ===== BOTTOM TIER ===== -->
                        <g>
                            <rect x="80" y="430" width="440" height="140" rx="16" fill="url(#tBot)" />
                            <!-- horizontal stripe detailing -->
                            <rect x="80" y="478" width="440" height="6" fill="#ffffff" opacity=".25" />
                            <rect x="80" y="520" width="440" height="6" fill="#ffffff" opacity=".18" />
                            <!-- icing top -->
                            <path
                                d="M70 432
                   Q 110 410 150 430
                   T 230 430
                   T 310 430
                   T 390 430
                   T 470 430
                   T 530 432
                   L 530 460
                   L 70 460 Z"
                                fill="url(#iBot)"
                            />
                            <!-- drips -->
                            <g class="drip" fill="url(#iBot)">
                                <path d="M105 458 q4 18 0 30 q-6 6 -10 0 q-4 -12 0 -30 z" />
                                <path d="M170 458 q5 26 0 40 q-7 7 -12 0 q-5 -16 0 -40 z" />
                                <path d="M240 458 q4 14 0 22 q-6 6 -10 0 q-4 -8 0 -22 z" />
                                <path d="M310 458 q5 30 0 46 q-7 7 -12 0 q-5 -18 0 -46 z" />
                                <path d="M380 458 q4 18 0 28 q-6 6 -10 0 q-4 -10 0 -28 z" />
                                <path d="M450 458 q5 24 0 38 q-7 7 -12 0 q-5 -14 0 -38 z" />
                                <path d="M500 458 q4 14 0 24 q-6 6 -10 0 q-4 -10 0 -24 z" />
                            </g>
                            <!-- sprinkles on bottom tier -->
                            <g class="sprinkle">
                                <rect
                                    x="120"
                                    y="498"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#ff3ebf"
                                    transform="rotate(20 125 500)"
                                />
                                <rect
                                    x="160"
                                    y="510"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#5ec8ff"
                                    transform="rotate(-30 165 512)"
                                />
                                <rect
                                    x="210"
                                    y="500"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#5be3c0"
                                    transform="rotate(45 215 502)"
                                />
                                <rect
                                    x="260"
                                    y="514"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#ffe14a"
                                    transform="rotate(-10 265 516)"
                                />
                                <rect
                                    x="310"
                                    y="498"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#ff7a59"
                                    transform="rotate(60 315 500)"
                                />
                                <rect
                                    x="360"
                                    y="512"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#7a5cff"
                                    transform="rotate(-50 365 514)"
                                />
                                <rect
                                    x="410"
                                    y="500"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#ff3ebf"
                                    transform="rotate(15 415 502)"
                                />
                                <rect
                                    x="460"
                                    y="514"
                                    width="10"
                                    height="3"
                                    rx="1.5"
                                    fill="#5be3c0"
                                    transform="rotate(-25 465 516)"
                                />
                                <circle cx="140" cy="540" r="3" fill="#fff" />
                                <circle cx="240" cy="545" r="3" fill="#ffe14a" />
                                <circle cx="340" cy="538" r="3" fill="#5ec8ff" />
                                <circle cx="440" cy="544" r="3" fill="#ff3ebf" />
                            </g>
                        </g>

                        <!-- ===== MIDDLE TIER ===== -->
                        <g>
                            <rect x="135" y="320" width="330" height="130" rx="14" fill="url(#tMid)" />
                            <!-- polka dots -->
                            <g fill="#fff" opacity=".55">
                                <circle cx="170" cy="360" r="6" />
                                <circle cx="210" cy="395" r="5" />
                                <circle cx="250" cy="358" r="6" />
                                <circle cx="290" cy="400" r="5" />
                                <circle cx="330" cy="362" r="6" />
                                <circle cx="370" cy="395" r="5" />
                                <circle cx="410" cy="360" r="6" />
                                <circle cx="440" cy="398" r="5" />
                            </g>

                            <!-- sneaky HTTP piped in icing -->
                            <text class="sneaky" x="300" y="395" text-anchor="middle">HTTP</text>

                            <!-- icing top -->
                            <path
                                d="M125 322
                   Q 165 300 205 322
                   T 285 322
                   T 365 322
                   T 445 322
                   T 475 324
                   L 475 350
                   L 125 350 Z"
                                fill="url(#iMid)"
                            />
                            <!-- drips -->
                            <g class="drip" fill="url(#iMid)">
                                <path d="M150 348 q4 16 0 26 q-6 6 -10 0 q-4 -8 0 -26 z" />
                                <path d="M210 348 q5 26 0 38 q-7 7 -12 0 q-5 -16 0 -38 z" />
                                <path d="M275 348 q4 14 0 22 q-6 6 -10 0 q-4 -8 0 -22 z" />
                                <path d="M340 348 q5 30 0 44 q-7 7 -12 0 q-5 -18 0 -44 z" />
                                <path d="M400 348 q4 18 0 28 q-6 6 -10 0 q-4 -10 0 -28 z" />
                                <path d="M455 348 q5 22 0 32 q-7 7 -12 0 q-5 -12 0 -32 z" />
                            </g>
                        </g>

                        <!-- ===== TOP TIER ===== -->
                        <g>
                            <rect x="190" y="220" width="220" height="110" rx="12" fill="url(#tTop)" />
                            <!-- chevron stripes -->
                            <g fill="#fff" opacity=".4">
                                <path
                                    d="M200 280 l16 -10 l16 10 l16 -10 l16 10 l16 -10 l16 10 l16 -10 l16 10 l16 -10 l16 10 l16 -10 l16 10 v6 l-16 -10 l-16 10 l-16 -10 l-16 10 l-16 -10 l-16 10 l-16 -10 l-16 10 l-16 -10 l-16 10 l-16 -10 l-16 10 z"
                                />
                            </g>
                            <!-- icing top -->
                            <path
                                d="M180 222
                   Q 220 200 260 222
                   T 340 222
                   T 410 222
                   L 420 224
                   L 420 250
                   L 180 250 Z"
                                fill="url(#iTop)"
                            />
                            <!-- drips -->
                            <g class="drip" fill="url(#iTop)">
                                <path d="M205 248 q4 18 0 28 q-6 6 -10 0 q-4 -10 0 -28 z" />

        <div class="hint">click anywhere to make a wish ✨</div>

        <script>
            // ---- name letters (so each one bobs independently)
            const NAME = 'Phan Nguyen Viet Dung';
            const nameEl = document.getElementById('name');
            [...NAME].forEach((ch, i) => {
                const s = document.createElement('span');
                if (ch === ' ') {
                    s.className = 'space';
                    s.textContent = '\u00A0';
                } else {
                    s.textContent = ch;
                }
                s.style.animationDelay = i * 0.07 + 's';
                nameEl.appendChild(s);
            });

            // ---- stars
            const starsEl = document.getElementById('stars');
            for (let i = 0; i < 70; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.animationDelay = Math.random() * 4 + 's';
                s.style.transform = `scale(${0.4 + Math.random() * 1.2})`;
                starsEl.appendChild(s);
            }

            // ---- confetti
            const colors = ['#ff3ebf', '#5ec8ff', '#ffe14a', '#5be3c0', '#ff7a59', '#7a5cff', '#ffb13b', '#ff4fa3'];
            const confEl = document.getElementById('confetti');
            for (let i = 0; i < 90; i++) {
                const c = document.createElement('div');
                c.className = 'c';
                const w = 6 + Math.random() * 8;
                c.style.left = Math.random() * 100 + 'vw';
                c.style.width = w + 'px';
                c.style.height = w * 1.4 + 'px';
                c.style.background = colors[i % colors.length];
                c.style.animationDuration = 4 + Math.random() * 6 + 's, ' + (0.8 + Math.random() * 1.6) + 's';
                c.style.animationDelay = -Math.random() * 8 + 's, ' + -Math.random() * 2 + 's';
                c.style.setProperty('--dx', (Math.random() - 0.5) * 40 + 'vw');
                if (Math.random() < 0.3) c.style.borderRadius = '50%';
                confEl.appendChild(c);
            }

            // ---- balloons
            const balEl = document.getElementById('balloons');
            function balloonSVG(color) {
                return `
    <svg viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx=".35" cy=".35" r=".7">
          <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
          <stop offset=".4" stop-color="${color}" stop-opacity="1"/>
          <stop offset="1" stop-color="${color}" stop-opacity="1"/>
        </radialGradient>
      </defs>
      <ellipse cx="40" cy="44" rx="32" ry="40" fill="url(#bg)"/>
      <path d="M40 84 l-6 8 l6 -2 l6 2 z" fill="${color}"/>
      <path d="M40 92 Q 48 102, 36 112 T 42 130" stroke="#ffffff80" stroke-width="1.4" fill="none"/>
      <ellipse cx="30" cy="32" rx="6" ry="10" fill="#ffffff" opacity=".4"/>
    </svg>`;
            }
            const bc = ['#ff3ebf', '#5ec8ff', '#ffe14a', '#5be3c0', '#7a5cff', '#ff7a59'];
            for (let i = 0; i < 7; i++) {
                const b = document.createElement('div');
                b.className = 'balloon';
                b.innerHTML = balloonSVG(bc[i % bc.length]);
                b.style.left = 5 + i * 14 + Math.random() * 4 + 'vw';
                b.style.width = 60 + Math.random() * 36 + 'px';
                b.style.animationDuration = 16 + Math.random() * 10 + 's';
                b.style.animationDelay = -Math.random() * 16 + 's';
                b.style.opacity = 0.85;
                balEl.appendChild(b);
            }

            // ---- click burst
            document.body.addEventListener('click', (e) => {
                for (let i = 0; i < 22; i++) {
                    const s = document.createElement('div');
                    s.className = 'spark';
                    s.style.left = e.clientX + 'px';
                    s.style.top = e.clientY + 'px';
                    const ang = Math.random() * Math.PI * 2;
                    const r = 40 + Math.random() * 120;
                    s.style.setProperty('--tx', Math.cos(ang) * r + 'px');
                    s.style.setProperty('--ty', Math.sin(ang) * r + 'px');
                    s.style.background = `radial-gradient(circle,#fff,${colors[i % colors.length]} 60%,transparent 70%)`;
                    document.body.appendChild(s);
                    setTimeout(() => s.remove(), 1000);
                }
            });
        </script>
